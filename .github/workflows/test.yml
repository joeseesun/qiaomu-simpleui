name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/test_customizations.py
      - run: python tests/test_refresh_lifecycle.py
      - run: python tests/test_weread_lifecycle.py
      - run: python tests/test_arrivals.py
      - run: python tests/test_home_controls.py
      - run: python tests/test_news.py
      - run: python tests/test_news_cache_images.py
      - run: python tests/test_news_epub.py
      - run: python tests/test_news_typography.py
      - run: python tests/test_ai_config.py
      - run: python tests/test_ai_lookup.py
      - run: python tests/test_ai_chat.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import polib
          for locale in ['zh_CN', 'zh_TW']:
              po = polib.pofile(str(Path('simpleui.koplugin/locale') / (locale + '.po')), check_for_duplicates=True)
              po.to_binary()
          PY
      - run: python scripts/package.py
